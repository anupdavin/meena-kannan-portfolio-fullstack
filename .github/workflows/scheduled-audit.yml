name: Scheduled Portfolio Quality & Memory Audit

on:
  schedule:
    # Runs every 12 hours (or custom cron) to continuously verify and audit the portfolio
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  scheduled-audit:
    name: Autonomous Quality & Memory Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Superpowers Autonomous Cycle
        run: npm run cycle

      - name: Compile TypeScript & Production Build
        run: npm run build
